<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Redirector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
            text-align: center;
            width: 400px;
        }
        h1 {
            color: #00ff41;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff41;
        }
        .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #0d0d0d;
            border: 2px solid #333;
            border-radius: 8px;
            color: #00ff41;
            font-size: 18px;
            text-align: center;
            outline: none;
            transition: 0.3s;
            font-family: 'Courier New', monospace;
        }
        input:focus {
            border-color: #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background: #00ff41;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button:hover {
            background: #00cc33;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.4);
            transform: scale(1.02);
        }
        .footer {
            color: #555;
            font-size: 11px;
            margin-top: 20px;
            letter-spacing: 1px;
        }
        .footer span {
            color: #00ff41;
        }
        #status {
            color: #ff4444;
            font-size: 13px;
            margin-top: 12px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛓️ SHINE GATE</h1>
        <div class="sub">// masukkan kode akses untuk ke web suntik sosmed//</div>
        <input type="text" id="kodeInput" placeholder="Ketik kode di sini..." autofocus>
        <button onclick="redirect()">➤ Verifikasi kode</button>
        <div id="status"></div>
        <div class="footer">© <span>Shine Shop</span> · 2023</div>
    </div>

    <script>
        function redirect() {
            const input = document.getElementById('kodeInput');
            const status = document.getElementById('status');
            let kode = input.value.trim();

            if (kode === '') {
                status.style.color = '#ff4444';
                status.innerText = '❌ Kode kosong, anjir! Isi dulu.';
                input.style.borderColor = '#ff4444';
                setTimeout(() => {
                    input.style.borderColor = '#333';
                }, 1000);
                return;
            }

            // Bersihin karakter aneh biar aman buat URL
            kode = encodeURIComponent(kode);

            status.style.color = '#00ff41';
            status.innerText = '⏳ Redirecting ke shinedomain...';

            // Delay dikit biar keliatan efeknya (1 detik)
            setTimeout(() => {
                window.location.href = 'https://shinedomain.my.id?ref=' + kode;
            }, 1000);
        }

        // Biar bisa enter juga
        document.getElementById('kodeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                redirect();
            }
        });
    </script>
</body>
</html>
